[package]
name = "quikfind"
version = "1.0.0"
description = "Blazing-fast private desktop search & launcher"
authors = ["QuikFind Team"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "quikfind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2.0 ecosystem
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"

# Search engine
tantivy = "0.22"
nucleo = "0.4"

# Async & parallel
tokio = { version = "1", features = ["full"] }
rayon = "1"

# File watching & traversal
notify = "8"
jwalk = "0.8"
globset = "0.4"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hashing
blake3 = "1"

# File & path utilities
open = "5"
dirs = "5"

# Desktop keyboard listener (Type to Search)
rdev = "0.5"

# Error handling & logging
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

# Data structures
lru = "0.12"
parking_lot = "0.12"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"

[dev-dependencies]
criterion = { version = "0.5" }

[[bench]]
name = "search"
harness = false

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.dev]
debug = true
opt-level = 0
